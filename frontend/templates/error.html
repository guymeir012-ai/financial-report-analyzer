{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<section class="panel error-box" role="alert">
  <p class="error-code"><bdi dir="ltr" class="num">{{ status }}</bdi></p>
  <h1>{{ title }}</h1>
  {% if company %}
  <p class="company-line"><bdi dir="ltr">{{ company }}</bdi> (<bdi dir="ltr" class="tag">{{ ticker }}</bdi>)</p>
  {% endif %}
  <p>{{ message }}</p>
  <div class="actions">
    <a class="btn primary" href="/">חזרה לדף הבית</a>
  </div>
</section>
{% endblock %}
